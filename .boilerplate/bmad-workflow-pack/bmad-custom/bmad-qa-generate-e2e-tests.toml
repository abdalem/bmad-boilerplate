[workflow]

activation_steps_append = [
  "Use an explicit test summary path when supplied. Otherwise use a provided Work Item ID, normalized to lowercase as work_item_id. For identity-free delivery use the supplied Build spec/output path or upstream project-level defaults; do not ask for an ID or create a placeholder contract merely to choose output paths.",
  "When work_item_id is available, treat {implementation_artifacts}/{work_item_id} as the effective implementation_artifacts folder and save the test summary under {implementation_artifacts}/{work_item_id}/tests/test-summary.md unless an explicit path is provided.",
]
