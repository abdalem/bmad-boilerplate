[workflow]

activation_steps_append = [
  "When invoked for a Work Item, determine its ID from the explicit request or contract path, normalize it to lowercase as work_item_id, read {project-root}/_bmad-output/planning-artifacts/{work_item_id}/work-item.md when present (otherwise use supplied intent), and bind UX output under that planning folder. For project-level UX, preserve the upstream project-level output behavior without asking for a Work Item ID.",
  "Read [design] from {project-root}/_bmad/custom/project-workflow.toml. For Work Item design, use Figma as the editable source, record approved file and node links in the existing work-item.md or current intent/spec, and update the configured durable screen registry and visual references.",
  "Ignore generic external design handoffs when project policy enables Figma. Cover relevant default, loading, empty, error, disabled, success, responsive, and accessibility-sensitive states before routing to Build.",
  "At completion return one next prompt. Route to bmad-spec only when behavior still needs elaboration; otherwise route to bmad-build after design approval.",
]


design_handoffs = [
  "tool:Figma: Create or update the Work Item's approved screens using the configured Figma integration, then return exact file and node links.",
]

on_complete = "Return approved Figma references, durable reference paths, and one copy-ready next prompt. Never commit automatically."
