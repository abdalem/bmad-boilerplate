[workflow]

activation_steps_append = [
  "Use an explicit output path when provided. Otherwise use a Work Item ID from the supplied intent or contract, normalized to lowercase as work_item_id. For identity-free delivery use the supplied Build spec/output path or upstream project-level defaults; do not require an ID or create a placeholder contract merely to choose a test output path.",
  "When work_item_id is available, after loading TEA config, treat {output_folder}/implementation-artifacts/{work_item_id}/tests as the effective test_artifacts folder for feature-level NFR outputs unless the user provides an explicit output path. Read any existing contract and routed planning sources from {output_folder}/planning-artifacts/{work_item_id}; otherwise use the supplied intent and Build spec.",
]
