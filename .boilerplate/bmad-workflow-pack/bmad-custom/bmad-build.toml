[workflow]

activation_steps_append = [
  "Read repository AGENTS.md. Use a tracker URL, ID, local path, pasted requirement, or explicit intent directly; a local work-item.md is optional. When identity is available, normalize it to lowercase as work_item_id for ticket paths.",
  "If a supplied or ticket-scoped work-item.md exists, read it and inherit Scope, Non-Goals, Acceptance Criteria, Fixed Decisions, and approved design references as binding. When absent, use supplied intent and tracker context; do not require publication or create a placeholder contract. Let upstream Build investigate and choose implementation ceremony.",
  "Respect semantic type boundaries: Module defines children; Request needs qualification; Spike produces research evidence and a decision, never production implementation unless explicitly converted. A non-cohesive Feature needs external child Issues. Preserve approved Figma design gates. Prefer the smallest clear implementation (KISS).",
  "Never commit, push, or create a pull request automatically; act only with explicit user authorization. Carry existing authorization forward. Leave implementation details to Build and request refinement only when binding product constraints would change.",
]

implementation_handoff = """
Launch a subagent with no prior conversation context, with this prompt:

> Read {spec_file} fully and every file listed in its frontmatter context. Read repository AGENTS.md before implementation. If a Work Item contract exists, inherit its Scope, Non-Goals, Acceptance Criteria, Fixed Decisions, and approved design references; otherwise use the spec's supplied intent.
>
> Prefer the smallest clear implementation (KISS). Never commit, push, or create a pull request automatically; explicit user authorization is required. Report changes, verification, anything incomplete or risky, and the recommended next prompt.
"""

# Inherit upstream review_layers and oneshot_review_layers unchanged.
on_complete = "Present implementation, verification, integrated review and repair evidence, remaining risks, and one copy-ready next prompt for bmad-close-work-item when complete. Never commit, push, or create a pull request automatically; require explicit user authorization."
