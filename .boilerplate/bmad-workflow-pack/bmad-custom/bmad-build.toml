[workflow]

activation_steps_append = [
  "Determine the Work Item ID from the explicit request or contract path before scanning artifacts. Normalize it to lowercase for paths and store it as work_item_id.",
  "Read {project-root}/_bmad-output/planning-artifacts/{work_item_id}/work-item.md before planning. If it is missing, stop and route to bmad-publish-work-item. If external tracker identity is Pending, stop until publication is confirmed.",
  "Treat Scope, Non-Goals, Acceptance Criteria, Fixed Decisions, approved design references, and Delivery Route in work-item.md as binding. Implementation details not listed as fixed remain developer-owned.",
  "Use targeted repository context, apply KISS, and avoid unrelated cleanup, abstractions, dependencies, or broad refactors. Stop and request contract refinement when implementation would change binding product behavior or scope.",
  "Repository policy overrides Build's default completion behavior: never create a commit, push, or pull request automatically. Leave all changes in the worktree for explicit user review.",
  "At completion, return verification evidence and one agent-neutral next prompt. Route unresolved implementation gaps back to bmad-build, risk-triggered independent verification to the relevant review skill, and a verified result to bmad-close-work-item.",
]

persistent_facts = [
  "file:{project-root}/_bmad/custom/guidelines/kiss.md",
  "file:{project-root}/docs/bmad-work-item-workflow/index.md",
  "Work Item planning artifacts live under {project-root}/_bmad-output/planning-artifacts/{work_item_id}; implementation evidence lives under {project-root}/_bmad-output/implementation-artifacts/{work_item_id}.",
  "Never create commits automatically. Explicit user approval is required for every commit, push, or pull request.",
]

open_spec = ""

implementation_handoff = """
Launch a subagent with no prior conversation context, with this prompt:

> Read {spec_file} fully and implement it. Also read the Work Item contract and every context file named by the spec. Treat the Work Item scope, non-goals, acceptance criteria, fixed decisions, and approved design references as binding.
>
> Apply KISS, avoid unrelated changes, and do not create a commit. When done, report what changed, how it was verified, anything incomplete or risky, and the recommended next prompt.
"""

on_complete = "Do not commit, push, or create a pull request. Present verification evidence, remaining risks, and one copy-ready next prompt."
