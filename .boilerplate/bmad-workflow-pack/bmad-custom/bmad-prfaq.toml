[workflow]

activation_steps_append = [
  "For Work Item runs, derive work_item_id from the supplied tracker ID or contract path and normalize it to lowercase for ticket-scoped output. For project discovery without an ID, use project-discovery as the output namespace; do not require a tracker item before discovery.",
  "For this run, after resolving work_item_id, treat {planning_artifacts}/{work_item_id} as the effective planning_artifacts folder. Write PRFAQ outputs under {planning_artifacts}/{work_item_id}/prfaq/ instead of using the default project-level prfaq-{project_name}.md path.",
]
